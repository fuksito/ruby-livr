name: test

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-24.04, not ubuntu-latest: setup-ruby has no Ruby 2.7-3.1 builds for ubuntu-26.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
